services:
  db:
    image: postgres:16
    container_name: pwd-saver-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-password_manager}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: always
    volumes:
      - pwdsaver-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-password_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./pwd-saver-be
    container_name: pwd-saver-be
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-password_manager}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY in .env (see .env.example)}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-8080}}
    ports:
      - "${BACKEND_PORT:-9090}:8080"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./pwd-saver-fe
    container_name: pwd-saver-fe
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Baked into the browser bundle's runtime config, so it must be an
      # origin the user's browser can reach — not the internal docker
      # network name.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-9090}}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: always

volumes:
  pwdsaver-postgres-data:
