spring:
  application:
    name: pwdsaver

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/password_manager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: ${SESSION_TIMEOUT:30m}

server:
  port: ${SERVER_PORT:8080}

credential:
  encryption:
    key: ${CREDENTIAL_ENCRYPTION_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

password:
  policy:
    max-failed-login-attempts: 3
  description:
    max-length: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
